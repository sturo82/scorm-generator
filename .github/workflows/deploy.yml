name: deploy

# Deploy di produzione su AWS. Richiede che l'infra Terraform (infra/) sia già
# applicata. Autenticazione ad AWS via OIDC (nessuna chiave statica).
#
# Topologia: API su App Runner (immagine ECR), frontend STATICO su S3+CloudFront.
#
# Repository variables (Settings → Secrets and variables → Actions → Variables):
#   vars.AWS_REGION              es. eu-west-1
#   vars.AWS_DEPLOY_ROLE_ARN     output github_deploy_role_arn
#   vars.ECR_API                 output ecr_api_url
#   vars.APPRUNNER_API_ARN       output apprunner_api_service_arn
#   vars.MIGRATE_PROJECT         output migrate_codebuild_project
#   vars.WEB_BUCKET              output web_bucket
#   vars.CLOUDFRONT_ID           output cloudfront_distribution_id
#   vars.WEB_DOMAIN              architect.knowkube.com
#   vars.API_DOMAIN              api.architect.knowkube.com
#   vars.COGNITO_ISSUER          output cognito_issuer
#   vars.COGNITO_CLIENT_ID       output cognito_web_client_id

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write # OIDC verso AWS
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: node:20.11.0-bookworm
    steps:
      - uses: actions/checkout@v4
      # Cache della cache di npm (~/.npm): npm ci la riusa, evitando di riscaricare
      # i pacchetti a ogni run. Invalidata quando cambia package-lock.json.
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - run: npm ci
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - run: npm run build
      - run: node_modules/.bin/vitest run
      - run: npm run lint

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Rileva se il push tocca le migrazioni Prisma: se NO, saltiamo CodeBuild
      # (le migrazioni sono idempotenti ma inutili senza nuove migrazioni, ~1min).
      - name: Rileva cambi migrazioni
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            migrations:
              - 'apps/api/prisma/migrations/**'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # --- API: build immagine (+ stage migrate), push su ECR -----------------
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Buildx abilita la cache dei layer Docker su GitHub Actions (type=gha):
      # i layer non cambiati (incluso `npm ci` dell'immagine) vengono riusati tra
      # run finché cambiano solo i sorgenti. Invalidata quando cambia il contesto
      # del layer (es. package-lock.json per lo stage deps).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push API image
        env:
          ECR_API: ${{ vars.ECR_API }}
          TAG: ${{ github.sha }}
        run: |
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Stage runtime (immagine servita da App Runner): tag sha + latest.
          # APP_VERSION/BUILD_TIME finiscono come env dell'immagine ed esposti in /health.
          docker buildx build \
            --target runtime \
            --build-arg APP_VERSION="$TAG" \
            --build-arg BUILD_TIME="$BUILD_TIME" \
            --cache-from type=gha,scope=api-runtime \
            --cache-to type=gha,scope=api-runtime,mode=max \
            -t "$ECR_API:$TAG" -t "$ECR_API:latest" \
            --push .
          # Stage migrate (task one-off migrazioni). Condivide i layer col runtime.
          docker buildx build \
            --target migrate \
            --cache-from type=gha,scope=api-runtime \
            --cache-from type=gha,scope=api-migrate \
            --cache-to type=gha,scope=api-migrate,mode=max \
            -t "$ECR_API:migrate" \
            --push .

      # --- Migrazioni DB (CodeBuild) — solo se sono cambiate le migrazioni ----
      # Via di fuga: un run manuale (workflow_dispatch) esegue SEMPRE le
      # migrazioni, utile se il filtro non le rilevasse o per forzarle.
      - name: Run DB migrations
        if: steps.changes.outputs.migrations == 'true' || github.event_name == 'workflow_dispatch'
        env:
          PROJECT: ${{ vars.MIGRATE_PROJECT }}
        run: |
          BUILD_ID=$(aws codebuild start-build --project-name "$PROJECT" --query 'build.id' --output text)
          echo "Build migrazioni: $BUILD_ID"
          while true; do
            STATUS=$(aws codebuild batch-get-builds --ids "$BUILD_ID" --query 'builds[0].buildStatus' --output text)
            echo "stato migrazioni: $STATUS"
            case "$STATUS" in
              SUCCEEDED) break ;;
              FAILED|FAULT|STOPPED|TIMED_OUT) echo "Migrazioni fallite"; exit 1 ;;
              *) sleep 10 ;;
            esac
          done

      - name: Deploy API (App Runner)
        env:
          API_ARN: ${{ vars.APPRUNNER_API_ARN }}
        run: aws apprunner start-deployment --service-arn "$API_ARN"

      # --- Web: build statico, sync su S3, invalidazione CloudFront -----------
      - name: Setup Node for web build
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
          cache: 'npm' # riusa la cache npm tra run (npm ci più veloce)

      - name: Build web (static export)
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_MODE: real
          NEXT_PUBLIC_API_URL: https://${{ vars.API_DOMAIN }}
          NEXT_PUBLIC_AUTH_MODE: oidc
          NEXT_PUBLIC_OIDC_ISSUER: ${{ vars.COGNITO_ISSUER }}
          NEXT_PUBLIC_OIDC_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
          NEXT_PUBLIC_OIDC_REDIRECT_URI: https://${{ vars.WEB_DOMAIN }}/auth/callback
          NEXT_PUBLIC_OIDC_SCOPE: openid email profile
          NEXT_PUBLIC_OIDC_AUDIENCE: ${{ vars.COGNITO_CLIENT_ID }}
          NEXT_PUBLIC_OIDC_AUTH_DOMAIN: ${{ vars.AUTH_DOMAIN }}
          # Versione mostrata in UI (footer): sha corto + istante del build.
          NEXT_PUBLIC_APP_VERSION: ${{ github.sha }}
        run: |
          # Istante del build in ISO UTC (affidabile, calcolato ora).
          export NEXT_PUBLIC_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # File di versione servito NO-CACHE: il footer lo interroga per capire
          # se è stata pubblicata una versione del web più recente di quella in
          # esecuzione (allora invita a ricaricare).
          printf '{"version":"%s","buildTime":"%s"}\n' \
            "$NEXT_PUBLIC_APP_VERSION" "$NEXT_PUBLIC_BUILD_TIME" > apps/web/public/version.json
          # NODE_ENV=production farebbe saltare le devDependencies (tsc, next):
          # forziamo l'install completo per avere i tool di build.
          npm ci --include=dev
          npm run build --workspace @scorm/contracts
          npm run build --workspace @scorm/scorm
          npm run build --workspace @scorm/web

      - name: Sync to S3 + invalidate CloudFront
        env:
          WEB_BUCKET: ${{ vars.WEB_BUCKET }}
          CLOUDFRONT_ID: ${{ vars.CLOUDFRONT_ID }}
        run: |
          # Asset con hash: cache lunga. HTML e version.json: no-cache (freschi).
          aws s3 sync apps/web/out "s3://$WEB_BUCKET" --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*.html" --exclude "version.json"
          aws s3 sync apps/web/out "s3://$WEB_BUCKET" --delete \
            --cache-control "no-cache" \
            --exclude "*" --include "*.html" --include "version.json"
          aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_ID" --paths "/*"
