name: deploy

# Deploy di produzione su AWS. Richiede che l'infra Terraform (infra/) sia già
# applicata. Autenticazione ad AWS via OIDC (nessuna chiave statica).
#
# Topologia: API su App Runner (immagine ECR), frontend STATICO su S3+CloudFront.
#
# Repository variables (Settings → Secrets and variables → Actions → Variables):
#   vars.AWS_REGION              es. eu-west-1
#   vars.AWS_DEPLOY_ROLE_ARN     output github_deploy_role_arn
#   vars.ECR_API                 output ecr_api_url
#   vars.APPRUNNER_API_ARN       output apprunner_api_service_arn
#   vars.MIGRATE_PROJECT         output migrate_codebuild_project
#   vars.WEB_BUCKET              output web_bucket
#   vars.CLOUDFRONT_ID           output cloudfront_distribution_id
#   vars.WEB_DOMAIN              architect.knowkube.com
#   vars.API_DOMAIN              api.architect.knowkube.com
#   vars.COGNITO_ISSUER          output cognito_issuer
#   vars.COGNITO_CLIENT_ID       output cognito_web_client_id

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write # OIDC verso AWS
  contents: read

jobs:
  # I tre job partono insieme: test, immagine API e build del web. Il deploy
  # parte solo se tutti e tre riescono, quindi nulla va online senza test verdi.
  test:
    runs-on: ubuntu-latest
    container: node:20.11.0-bookworm
    steps:
      - uses: actions/checkout@v4
      # Cache della cache di npm (~/.npm): npm ci la riusa, evitando di riscaricare
      # i pacchetti a ogni run. Invalidata quando cambia package-lock.json.
      # sharp (>= 0.33) arriva come pacchetti npm precompilati (@img/sharp-*):
      # niente compilazione da sorgente né download da GitHub.
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - run: npm ci
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - run: npm run build
      - run: node_modules/.bin/vitest run
      - run: npm run lint

  # Immagine API: pubblicata su ECR SOLO con il tag del commit. Il tag `latest`
  # (quello che App Runner esegue) si sposta nel job deploy, dopo i test.
  image:
    runs-on: ubuntu-latest
    outputs:
      migrations: ${{ steps.changes.outputs.migrations }}
    steps:
      - uses: actions/checkout@v4
      # Rileva se il push tocca le migrazioni Prisma: se NO, saltiamo l'immagine
      # migrate e CodeBuild.
      - name: Rileva cambi migrazioni
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            migrations:
              - 'apps/api/prisma/migrations/**'
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
      # Buildx abilita la cache dei layer Docker su GitHub Actions (type=gha).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build & push API image
        env:
          ECR_API: ${{ vars.ECR_API }}
          TAG: ${{ github.sha }}
        run: |
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # APP_VERSION/BUILD_TIME finiscono come env dell'immagine ed esposti in /health.
          docker buildx build \
            --target runtime \
            --build-arg APP_VERSION="$TAG" \
            --build-arg BUILD_TIME="$BUILD_TIME" \
            --cache-from type=gha,scope=api-runtime \
            --cache-to type=gha,scope=api-runtime,mode=max \
            -t "$ECR_API:$TAG" \
            --push .
      # Stage migrate (task one-off migrazioni): solo se servono le migrazioni.
      - name: Build & push migrate image
        if: steps.changes.outputs.migrations == 'true' || github.event_name == 'workflow_dispatch'
        env:
          ECR_API: ${{ vars.ECR_API }}
        run: |
          docker buildx build \
            --target migrate \
            --cache-from type=gha,scope=api-runtime \
            --cache-from type=gha,scope=api-migrate \
            --cache-to type=gha,scope=api-migrate,mode=max \
            -t "$ECR_API:migrate" \
            --push .

  # Web statico: build in parallelo, pubblicato come artifact e caricato su S3
  # solo dopo che l'API nuova è online.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node for web build
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
          cache: 'npm' # riusa la cache npm tra run (npm ci più veloce)

      - name: Build web (static export)
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_MODE: real
          NEXT_PUBLIC_API_URL: https://${{ vars.API_DOMAIN }}
          NEXT_PUBLIC_AUTH_MODE: oidc
          NEXT_PUBLIC_OIDC_ISSUER: ${{ vars.COGNITO_ISSUER }}
          NEXT_PUBLIC_OIDC_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
          NEXT_PUBLIC_OIDC_REDIRECT_URI: https://${{ vars.WEB_DOMAIN }}/auth/callback
          NEXT_PUBLIC_OIDC_SCOPE: openid email profile
          NEXT_PUBLIC_OIDC_AUDIENCE: ${{ vars.COGNITO_CLIENT_ID }}
          NEXT_PUBLIC_OIDC_AUTH_DOMAIN: ${{ vars.AUTH_DOMAIN }}
          # Versione mostrata in UI (footer): sha corto + istante del build.
          NEXT_PUBLIC_APP_VERSION: ${{ github.sha }}
        run: |
          # Istante del build in ISO UTC (affidabile, calcolato ora).
          export NEXT_PUBLIC_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # File di versione servito NO-CACHE: il footer lo interroga per capire
          # se è stata pubblicata una versione del web più recente di quella in
          # esecuzione (allora invita a ricaricare).
          printf '{"version":"%s","buildTime":"%s"}\n' \
            "$NEXT_PUBLIC_APP_VERSION" "$NEXT_PUBLIC_BUILD_TIME" > apps/web/public/version.json
          # NODE_ENV=production farebbe saltare le devDependencies (tsc, next):
          # forziamo l'install completo per avere i tool di build.
          npm ci --include=dev
          npm run build --workspace @scorm/contracts
          npm run build --workspace @scorm/scorm
          npm run build --workspace @scorm/web

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-out
          path: apps/web/out
          retention-days: 3

  deploy:
    needs: [test, image, web]
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      # Test verdi: l'immagine del commit diventa `latest`, quella che App Runner esegue.
      - name: Promote image to latest
        env:
          ECR_API: ${{ vars.ECR_API }}
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          REPO="${ECR_API#*/}"
          MANIFEST=$(aws ecr batch-get-image --repository-name "$REPO" --image-ids imageTag="$TAG" \
            --accepted-media-types application/vnd.oci.image.index.v1+json application/vnd.oci.image.manifest.v1+json application/vnd.docker.distribution.manifest.v2+json application/vnd.docker.distribution.manifest.list.v2+json \
            --query 'images[0].imageManifest' --output text)
          MEDIA=$(aws ecr batch-get-image --repository-name "$REPO" --image-ids imageTag="$TAG" \
            --accepted-media-types application/vnd.oci.image.index.v1+json application/vnd.oci.image.manifest.v1+json application/vnd.docker.distribution.manifest.v2+json application/vnd.docker.distribution.manifest.list.v2+json \
            --query 'images[0].imageManifestMediaType' --output text)
          # Se `latest` punta già allo stesso manifest, ECR risponde ImageAlreadyExistsException: va bene.
          aws ecr put-image --repository-name "$REPO" --image-tag latest \
            --image-manifest "$MANIFEST" --image-manifest-media-type "$MEDIA" >/dev/null \
            || aws ecr describe-images --repository-name "$REPO" --image-ids imageTag=latest \
                 --query "imageDetails[0].imageTags" --output text | grep -qw "$TAG"
          echo "latest -> $TAG"
      # --- Migrazioni DB (CodeBuild) — solo se sono cambiate le migrazioni ----
      # Via di fuga: un run manuale (workflow_dispatch) esegue SEMPRE le
      # migrazioni, utile se il filtro non le rilevasse o per forzarle.
      - name: Run DB migrations
        if: needs.image.outputs.migrations == 'true' || github.event_name == 'workflow_dispatch'
        env:
          PROJECT: ${{ vars.MIGRATE_PROJECT }}
        run: |
          BUILD_ID=$(aws codebuild start-build --project-name "$PROJECT" --query 'build.id' --output text)
          echo "Build migrazioni: $BUILD_ID"
          while true; do
            STATUS=$(aws codebuild batch-get-builds --ids "$BUILD_ID" --query 'builds[0].buildStatus' --output text)
            echo "stato migrazioni: $STATUS"
            case "$STATUS" in
              SUCCEEDED) break ;;
              FAILED|FAULT|STOPPED|TIMED_OUT) echo "Migrazioni fallite"; exit 1 ;;
              *) sleep 10 ;;
            esac
          done

      - name: Deploy API (App Runner)
        env:
          API_ARN: ${{ vars.APPRUNNER_API_ARN }}
        run: |
          set -euo pipefail
          # App Runner NON consente operazioni concorrenti: se il servizio è in
          # OPERATION_IN_PROGRESS (es. un deploy precedente ancora in corso),
          # start-deployment fallisce con InvalidStateException. Attendiamo che
          # torni RUNNING (o uno stato stabile) prima di avviare il deploy.
          wait_stable() {
            local tries=0
            while true; do
              STATUS=$(aws apprunner describe-service --service-arn "$API_ARN" --query 'Service.Status' --output text)
              echo "App Runner status: $STATUS"
              case "$STATUS" in
                RUNNING) return 0 ;;
                CREATE_FAILED|DELETE_FAILED|DELETED) echo "Stato non deployabile: $STATUS"; exit 1 ;;
                *) : ;; # OPERATION_IN_PROGRESS o transitori: attendi
              esac
              tries=$((tries+1))
              if [ "$tries" -gt 120 ]; then echo "Timeout attesa stato stabile"; exit 1; fi
              sleep 10
            done
          }

          wait_stable
          echo "Avvio deployment…"
          OP_ID=$(aws apprunner start-deployment --service-arn "$API_ARN" --query 'OperationId' --output text)
          echo "OperationId: $OP_ID"

          # Attendi il completamento del deploy: il servizio torna RUNNING.
          tries=0
          while true; do
            STATUS=$(aws apprunner describe-service --service-arn "$API_ARN" --query 'Service.Status' --output text)
            echo "Deploy in corso, status: $STATUS"
            if [ "$STATUS" = "RUNNING" ]; then echo "Deploy completato"; break; fi
            tries=$((tries+1))
            if [ "$tries" -gt 120 ]; then echo "Timeout attesa completamento deploy"; exit 1; fi
            sleep 10
          done

      # --- Web: sync su S3 e invalidazione CloudFront ---------------------------
      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-out
          path: apps/web/out
      - name: Sync to S3 + invalidate CloudFront
        env:
          WEB_BUCKET: ${{ vars.WEB_BUCKET }}
          CLOUDFRONT_ID: ${{ vars.CLOUDFRONT_ID }}
        run: |
          # Asset con hash: cache lunga. HTML e version.json: no-cache (freschi).
          aws s3 sync apps/web/out "s3://$WEB_BUCKET" --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*.html" --exclude "version.json"
          aws s3 sync apps/web/out "s3://$WEB_BUCKET" --delete \
            --cache-control "no-cache" \
            --exclude "*" --include "*.html" --include "version.json"
          aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_ID" --paths "/*"
