name: deploy

# Deploy di produzione su AWS App Runner. Richiede che l'infra Terraform (infra/)
# sia già applicata. Autenticazione ad AWS via OIDC (nessuna chiave statica):
# il ruolo è l'output `github_deploy_role_arn` del Terraform.
#
# Variabili/segreti del repo da impostare (Settings → Secrets and variables):
#   vars.AWS_REGION               es. eu-west-1
#   vars.AWS_DEPLOY_ROLE_ARN      output github_deploy_role_arn
#   vars.ECR_API                  output ecr_api_url
#   vars.ECR_WEB                  output ecr_web_url
#   vars.APPRUNNER_API_ARN        output apprunner_api_service_arn
#   vars.APPRUNNER_WEB_ARN        output apprunner_web_service_arn
#   vars.MIGRATE_PROJECT          output migrate_codebuild_project
#   vars.WEB_DOMAIN               architect.knowkube.com
#   vars.API_DOMAIN               api.architect.knowkube.com
#   vars.COGNITO_ISSUER           output cognito_issuer
#   vars.COGNITO_CLIENT_ID        output cognito_web_client_id

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write # OIDC verso AWS
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: node:20.11.0-bookworm
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - run: npm run build
      - run: node_modules/.bin/vitest run
      - run: npm run lint

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push API image (+ migrate stage)
        env:
          ECR_API: ${{ vars.ECR_API }}
          TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_API:$TAG" -t "$ECR_API:latest" --target runtime .
          docker build -t "$ECR_API:migrate" --target migrate .
          docker push "$ECR_API:$TAG"
          docker push "$ECR_API:latest"
          docker push "$ECR_API:migrate"

      - name: Build & push Web image
        env:
          ECR_WEB: ${{ vars.ECR_WEB }}
          TAG: ${{ github.sha }}
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          WEB_DOMAIN: ${{ vars.WEB_DOMAIN }}
          COGNITO_ISSUER: ${{ vars.COGNITO_ISSUER }}
          COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
        run: |
          docker build -f Dockerfile.web \
            --build-arg NEXT_PUBLIC_API_MODE=real \
            --build-arg NEXT_PUBLIC_API_URL="https://$API_DOMAIN" \
            --build-arg NEXT_PUBLIC_AUTH_MODE=oidc \
            --build-arg NEXT_PUBLIC_OIDC_ISSUER="$COGNITO_ISSUER" \
            --build-arg NEXT_PUBLIC_OIDC_CLIENT_ID="$COGNITO_CLIENT_ID" \
            --build-arg NEXT_PUBLIC_OIDC_REDIRECT_URI="https://$WEB_DOMAIN/auth/callback" \
            --build-arg NEXT_PUBLIC_OIDC_SCOPE="openid email profile" \
            --build-arg NEXT_PUBLIC_OIDC_AUDIENCE="$COGNITO_CLIENT_ID" \
            -t "$ECR_WEB:$TAG" -t "$ECR_WEB:latest" .
          docker push "$ECR_WEB:$TAG"
          docker push "$ECR_WEB:latest"

      - name: Run DB migrations (CodeBuild in VPC)
        env:
          PROJECT: ${{ vars.MIGRATE_PROJECT }}
        run: |
          BUILD_ID=$(aws codebuild start-build --project-name "$PROJECT" --query 'build.id' --output text)
          echo "Avviata build migrazioni: $BUILD_ID"
          # Attende il completamento.
          while true; do
            STATUS=$(aws codebuild batch-get-builds --ids "$BUILD_ID" --query 'builds[0].buildStatus' --output text)
            echo "stato migrazioni: $STATUS"
            case "$STATUS" in
              SUCCEEDED) break ;;
              FAILED|FAULT|STOPPED|TIMED_OUT) echo "Migrazioni fallite"; exit 1 ;;
              *) sleep 10 ;;
            esac
          done

      - name: Deploy App Runner (API + Web)
        env:
          API_ARN: ${{ vars.APPRUNNER_API_ARN }}
          WEB_ARN: ${{ vars.APPRUNNER_WEB_ARN }}
        run: |
          aws apprunner start-deployment --service-arn "$API_ARN"
          aws apprunner start-deployment --service-arn "$WEB_ARN"
          echo "Deployment avviati. Monitorare su console App Runner."
